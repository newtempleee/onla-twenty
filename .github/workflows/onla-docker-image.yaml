name: Onla Docker Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to publish"
        required: true
        default: "v2.7.3-onla.1"
  push:
    branches:
      - onla/v2.7.3-bootstrap
    paths:
      - "packages/**"
      - ".github/workflows/onla-docker-image.yaml"
      - "package.json"
      - "yarn.lock"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Onla Twenty image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          push: true
          tags: |
            ghcr.io/newtempleee/onla-twenty:${{ github.event.inputs.image_tag || 'v2.7.3-onla.1' }}
            ghcr.io/newtempleee/onla-twenty:onla-v2.7.3-bootstrap
          cache-from: type=gha
          cache-to: type=gha,mode=max
